[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-financial-audit"
version = "1.0.1"
description = "Arithmetic consistency checks for supplied financial statement data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GenPark AI Engineering"}]
dependencies = []
keywords = ["genpark", "mcp", "ai-agent", "python"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/Alpha-Park/genpark-complex-financial-formula-audit-validator-skill"
Documentation = "https://github.com/Alpha-Park/genpark-complex-financial-formula-audit-validator-skill#readme"
Issues = "https://github.com/Alpha-Park/genpark-complex-financial-formula-audit-validator-skill/issues"
Homepage = "https://genpark.ai/mcp"

[project.scripts]
genpark-financial-audit = "genpark_financial_audit.server:main"

[tool.setuptools.packages.find]
include = ["genpark_financial_audit*"]
